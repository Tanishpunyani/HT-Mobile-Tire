name: CI Pipeline

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      ADMIN_SESSION_SECRET: test_admin_session_secret_32_characters_long_ci
      TECHNICIAN_DISPATCH_SECRET: test_tech_dispatch_secret_32_characters_ci
      NEXT_PUBLIC_SUPABASE_URL: https://mock-supabase.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock_anon_key
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock_service_key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: frontend
        env:
          DIRECT_URL: postgresql://localhost:5432/ci
        run: npx prisma generate

      - name: TypeScript Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Run E2E Journey Tests
        run: npm run test:e2e

      - name: Run Master Regression Suite
        run: npm test

      - name: Production Build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ci
        run: npm run build
